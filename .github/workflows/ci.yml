name: Vérification et build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests et build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Exécuter les tests
        run: npm test

      - name: Construire l’application
        run: npm run build

      - name: Vérifier les fichiers produits
        run: |
          test -f server/dist/index.js
          test -f server/dist/db/migrations/007_admin_audit_read.sql
          test -f web/dist/index.html
          test -f web/dist/media/hero-editorial.jpg
