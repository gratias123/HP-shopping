name: keepalive
# Réveille le site Render gratuit toutes les 10 minutes pour éviter l'écran d'attente après inactivité.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --max-time 60 https://hp-collection-shop.onrender.com/api/health || true
